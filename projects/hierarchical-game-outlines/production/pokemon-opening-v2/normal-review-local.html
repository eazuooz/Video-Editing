<!doctype html><meta charset="utf-8"><title>계층형 아웃라인 · 포켓몬 도입 수정본 검수</title><style>body{margin:0;background:#171c20;color:white;font:18px sans-serif}header{padding:12px}video{display:block;width:100%;height:78vh;background:black}button{font:18px sans-serif;padding:10px;margin:5px}pre{white-space:pre-wrap}</style><header>계층형 아웃라인 · 포켓몬 도입 수정본 <button onclick="v.currentTime=0;v.playbackRate=1;v.muted=true;v.play()">처음부터 1배속 재생</button><button onclick="v.pause()">일시정지</button></header><video id="v" src="hierarchical-game-outlines.captioned.review.mp4" controls muted preload="metadata"></video><pre id="status"></pre><script>const v=document.querySelector('video');const status=document.querySelector('#status');function show(){status.textContent=JSON.stringify({time:v.currentTime,duration:v.duration,paused:v.paused,ended:v.ended,rate:v.playbackRate,muted:v.muted,width:v.videoWidth,height:v.videoHeight});}v.ontimeupdate=show;v.onloadedmetadata=show;v.onended=show;</script>
