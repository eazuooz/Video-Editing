<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloudpost Relay · 관전 설계 플레이테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#cce7ec;color:#203c41;font-family:'Malgun Gothic',sans-serif}main{max-width:1920px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9;background:#cce7ec}nav{display:flex;gap:8px;align-items:center;padding:12px;background:#f6f1df;flex-wrap:wrap}button{font:600 15px 'Malgun Gothic';border:1px solid #aec2be;background:white;border-radius:8px;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{background:#1b625a;color:white}small{margin-left:auto}#status{padding:8px 14px;font-size:13px;background:#f6f1df} .capture nav,.capture #status{display:none}
</style>
<main><canvas width="1920" height="1080" aria-label="세 배달원이 장애물을 넘는 구름섬 우편 경주"></canvas>
<nav aria-label="플레이테스트 조작">
<button data-action="start">경주 시작</button><button data-action="select" data-value="star">별 따라가기</button><button data-action="select" data-value="leaf">잎 따라가기</button><button data-action="select" data-value="moon">달 따라가기</button><button data-action="select" data-value="">선택 없이 보기</button>
<button data-action="camera" data-value="overview">전체 경로</button><button data-action="camera" data-value="follow">대상 카메라</button><button id="markers" aria-pressed="true">식별 표식</button><button id="auto" aria-pressed="true">자동 경주</button><button data-action="pause">일시정지 / 계속</button><button id="restart">새 경주</button>
<small>1·2·3 대상 / O 전체 / F 따라가기 / M 표식 / Space 점프 / → 전진</small></nav><div id="status" role="status">준비 · 사람의 재미 평가는 아직 수행하지 않았습니다.</div></main>
<script src="race.cjs"></script><script src="view.js"></script></html>
