<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">같은 던전에서 열쇠만 옮기면</title>
  <desc id="desc">위는 열쇠가 잠긴 문 뒤에 있어 진행이 막힌다. 아래는 열쇠가 갈림길에서 닿는 옆방에 있어 문을 열 수 있다.</desc>
  <rect width="1080" height="1920" fill="#101412" />
  <text x="78" y="148" fill="#F8D775" font-size="58" font-weight="700" font-family="Malgun Gothic, sans-serif">같은 던전에서 열쇠만 옮기면</text>
  <text x="78" y="226" fill="#AABBB1" font-size="37" font-weight="400" font-family="Malgun Gothic, sans-serif">방과 통로, 잠긴 문의 규칙은 그대로</text>
  <g id="key-behind-gate">
    <text x="79" y="323" fill="#74DCDB" font-size="42" font-weight="700" font-family="Malgun Gothic, sans-serif">A</text>
    <text x="139" y="323" fill="#EDF3EF" font-size="42" font-weight="700" font-family="Malgun Gothic, sans-serif">열쇠가 잠긴 문 뒤에 있다</text>
    <line x1="149" y1="473" x2="413" y2="473" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
    <line x1="413" y1="473" x2="413" y2="639" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
    <line x1="413" y1="473" x2="886" y2="473" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
    <rect x="64" y="421" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="149" y="487" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">입구</text>
    <rect x="328" y="421" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="413" y="487" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">갈림길</text>
    <rect x="328" y="587" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="413" y="653" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">옆방</text>
    <rect x="801" y="421" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="886" y="474" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">출구방</text>
    <circle cx="872" cy="499" r="11" stroke="#A6E492" stroke-width="6" fill="#101412" />
    <line x1="883" y1="499" x2="912" y2="499" stroke="#A6E492" stroke-width="6" stroke-linecap="round" />
    <line x1="907" y1="499" x2="907" y2="508" stroke="#A6E492" stroke-width="5" stroke-linecap="round" />
    <rect x="613" y="439" width="66" height="67" rx="10" stroke="#FFB87F" stroke-width="6" fill="#101412" />
    <line x1="646" y1="459" x2="646" y2="487" stroke="#FFB87F" stroke-width="7" stroke-linecap="round" />
    <text x="646" y="416" fill="#FFB87F" font-size="34" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">잠긴 문</text>
    <text x="79" y="756" fill="#EDF3EF" font-size="33" font-weight="400" font-family="Malgun Gothic, sans-serif">열쇠에 닿을 수 없어 출구도 막힘</text>
  </g>
  <g id="key-in-alcove">
    <text x="79" y="855" fill="#74DCDB" font-size="42" font-weight="700" font-family="Malgun Gothic, sans-serif">B</text>
    <text x="139" y="855" fill="#EDF3EF" font-size="42" font-weight="700" font-family="Malgun Gothic, sans-serif">열쇠가 닿을 수 있는 옆방에 있다</text>
    <line x1="149" y1="1005" x2="413" y2="1005" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
    <line x1="413" y1="1005" x2="413" y2="1171" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
    <line x1="413" y1="1005" x2="886" y2="1005" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
    <rect x="64" y="953" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="149" y="1019" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">입구</text>
    <rect x="328" y="953" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="413" y="1019" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">갈림길</text>
    <rect x="328" y="1119" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="413" y="1172" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">옆방</text>
    <circle cx="399" cy="1197" r="11" stroke="#A6E492" stroke-width="6" fill="#101412" />
    <line x1="410" y1="1197" x2="439" y2="1197" stroke="#A6E492" stroke-width="6" stroke-linecap="round" />
    <line x1="434" y1="1197" x2="434" y2="1206" stroke="#A6E492" stroke-width="5" stroke-linecap="round" />
    <rect x="801" y="953" width="170" height="104" rx="16" stroke="#455B50" stroke-width="6" fill="#101412" />
    <text x="886" y="1019" fill="#EDF3EF" font-size="38" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">출구방</text>
    <rect x="613" y="971" width="66" height="67" rx="10" stroke="#FFB87F" stroke-width="6" fill="#101412" />
    <line x1="646" y1="991" x2="646" y2="1019" stroke="#FFB87F" stroke-width="7" stroke-linecap="round" />
    <text x="646" y="948" fill="#FFB87F" font-size="34" font-weight="700" font-family="Malgun Gothic, sans-serif" text-anchor="middle">잠긴 문</text>
    <text x="79" y="1288" fill="#EDF3EF" font-size="33" font-weight="400" font-family="Malgun Gothic, sans-serif">옆방에서 열쇠를 얻어 돌아오면 통과</text>
  </g>
  <line x1="79" y1="1358" x2="1001" y2="1358" stroke="#455B50" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="1436" x2="139" y2="1436" stroke="#74DCDB" stroke-width="8" stroke-linecap="round" />
  <text x="158" y="1448" fill="#EDF3EF" font-size="34" font-weight="400" font-family="Malgun Gothic, sans-serif">통로</text>
  <rect x="378" y="1403" width="66" height="67" rx="10" stroke="#FFB87F" stroke-width="6" fill="#101412" />
  <line x1="411" y1="1423" x2="411" y2="1451" stroke="#FFB87F" stroke-width="7" stroke-linecap="round" />
  <text x="465" y="1448" fill="#EDF3EF" font-size="34" font-weight="400" font-family="Malgun Gothic, sans-serif">잠긴 문</text>
  <circle cx="739" cy="1437" r="11" stroke="#A6E492" stroke-width="6" fill="#101412" />
  <line x1="750" y1="1437" x2="779" y2="1437" stroke="#A6E492" stroke-width="6" stroke-linecap="round" />
  <line x1="774" y1="1437" x2="774" y2="1446" stroke="#A6E492" stroke-width="5" stroke-linecap="round" />
  <text x="800" y="1448" fill="#EDF3EF" font-size="34" font-weight="400" font-family="Malgun Gothic, sans-serif">열쇠</text>
</svg>
