<!doctype html><html lang="ko"><meta charset="utf-8"><title>Original Input State Workshop</title><style>html,body{margin:0;background:#d8e7d7;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style><canvas width="1920" height="1080"></canvas><script>
// This is a real local game/UI artifact. Capture sends native browser keyboard
// events; the clock controls only deterministic simulation time, not outcomes.
const mode=new URLSearchParams(location.search).get('mode')||'receipt',c=document.querySelector('canvas').getContext('2d');
let t=0,last=0;const keys=new Set();window.inputLog=[];window.outcomeLog=[];window.soundLog=[];
const names={receipt:'입력 수신 / 잠긴 문',blocked:'건설 상태 / 이유를 알아보기',menu:'메뉴 확인 / 같은 의도',cutscene:'컷신 / 응답 뒤에 확정',pending:'모의 저장 / 처리 상태',context:'맥락 / 필요한 반응'};
const pendingSeconds=Number(new URLSearchParams(location.search).get('pendingSeconds')||4);
const make=()=>({hasKey:false,open:false,x:100,wood:2,col:2,row:2,buildings:[{col:2,row:2}],menu:true,selection:0,started:false,story:0,skipAt:null,promptUntil:0,progress:0,pending:false,doneAt:0,saves:0,paused:false,message:'',messageUntil:0,pulse:0,blockedPulseUntil:0});
const states=[make(),make()];
function feedback(i,text,kind='notice',seconds=2.6){const s=states[i];s.message=text;s.messageUntil=t+seconds;s.pulse=t;window.outcomeLog.push({t,panel:i,kind:'feedback',text,reason:kind});window.soundLog.push({t,panel:i,kind:kind==='blocked'?'refusal':kind==='complete'?'complete':'received'});}
function action(i,code){const s=states[i],ack=i===1;window.outcomeLog.push({t,panel:i,kind:'received',code});
 if(mode==='receipt'){
  if(code==='Space'){if(s.hasKey){s.open=true;window.outcomeLog.push({t,panel:i,kind:'opened'});feedback(i,'문이 열렸습니다','complete');}else{window.outcomeLog.push({t,panel:i,kind:'blocked',reason:'locked'});if(ack)feedback(i,'잠겨 있음 · 열쇠가 필요합니다','blocked');}}
  if(code==='KeyE'&&s.x>340){s.hasKey=true;feedback(i,'열쇠를 주웠습니다','complete');}
 }else if(mode==='blocked'){
  if(code==='ArrowRight')s.col=Math.min(4,s.col+1);if(code==='ArrowLeft')s.col=Math.max(0,s.col-1);if(code==='ArrowUp')s.row=Math.max(0,s.row-1);if(code==='ArrowDown')s.row=Math.min(3,s.row+1);
  if(code==='KeyE'){s.wood+=4;feedback(i,'재료 +4','complete');}
  if(code==='Space'){const occupied=s.buildings.some(b=>b.col===s.col&&b.row===s.row);if(occupied||s.wood<4){const reason=occupied?'occupied':'materials';s.blockedPulseUntil=t+.7;if(!ack)window.outcomeLog.push({t,panel:i,kind:'color-only-refusal',reason});window.outcomeLog.push({t,panel:i,kind:'blocked',reason,wood:s.wood,col:s.col,row:s.row});if(ack)feedback(i,occupied?'다른 건물과 겹칩니다':'재료 부족 · 나무 4개 필요','blocked');}else{s.wood-=4;s.buildings.push({col:s.col,row:s.row});feedback(i,'건설 완료','complete');window.outcomeLog.push({t,panel:i,kind:'built',col:s.col,row:s.row,wood:s.wood});}}
 }else if(mode==='menu'){
  if(code==='Escape'){s.menu=true;s.started=false;feedback(i,'메뉴로 돌아왔습니다');}
  if(s.menu&&code==='ArrowDown')s.selection=1;if(s.menu&&code==='ArrowUp')s.selection=0;
  if(s.menu&&(code==='Enter'||(ack&&code==='Space'))){s.menu=false;s.started=true;feedback(i,s.selection?'연습 모드 시작':'탐험 시작','complete');window.outcomeLog.push({t,panel:i,kind:'confirmed',code,selection:s.selection});}
 }else if(mode==='cutscene'){
  if(code==='Space'&&!s.skipAt){s.promptUntil=t+4;if(ack)feedback(i,'길게 눌러 건너뛰기', 'notice',4);}
  if(code==='KeyR'){s.story=0;s.skipAt=null;s.progress=0;s.promptUntil=0;s.message='';window.outcomeLog.push({t,panel:i,kind:'restart-story'});}
 }else if(mode==='pending'){
  if(code==='Space'){if(s.pending){window.outcomeLog.push({t,panel:i,kind:'ignored-duplicate',queued:false});if(ack)feedback(i,'진행 중 · 잠시 기다려 주세요');}else{s.pending=true;s.doneAt=t+pendingSeconds;window.outcomeLog.push({t,panel:i,kind:'save-request',complete:false,simulatedSeconds:pendingSeconds});if(ack)feedback(i,'저장 중…','notice',4);}}
 }else if(mode==='context'){
  if(code==='Escape'){s.paused=!s.paused;feedback(i,s.paused?'메뉴 열기':'게임으로 돌아가기');}
  if(code==='Space'){if(s.paused){s.paused=false;feedback(i,'계속하기','complete');}else{window.outcomeLog.push({t,panel:i,kind:'blocked',reason:'out-of-range'});feedback(i,'대상이 너무 멉니다','blocked');}}
  if(code==='KeyQ'||code==='KeyZ'){window.outcomeLog.push({t,panel:i,kind:'unassigned',code,state:s.paused?'menu':'play'});if(!ack)feedback(i,'이 키에는 기능이 없습니다','blocked');}
 }
}
document.addEventListener('keydown',e=>{e.preventDefault();if(keys.has(e.code))return;keys.add(e.code);window.inputLog.push({t,code:e.code,down:true});for(let i=0;i<2;i++)action(i,e.code);});
document.addEventListener('keyup',e=>{e.preventDefault();keys.delete(e.code);window.inputLog.push({t,code:e.code,down:false});if(mode==='cutscene'&&e.code==='Space')for(let i=0;i<2;i++){const s=states[i];if(s.progress>0&&s.progress<1.2){window.outcomeLog.push({t,panel:i,kind:'cancel-confirmation',progress:s.progress});if(i)feedback(i,'확인 취소 · 장면 계속', 'notice',2);}s.progress=0;}});
function rect(x,y,w,h,col,r=0){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}function text(str,x,y,size=30,col='#263a35',align='center'){c.fillStyle=col;c.font=`600 ${size}px "Malgun Gothic", sans-serif`;c.textAlign=align;c.textBaseline='middle';c.fillText(str,x,y);}
function iso(x,y,w,h,z,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y+h);c.lineTo(x,y+2*h);c.lineTo(x-w,y+h);c.closePath();c.fill();if(z){c.fillStyle='#668b75';c.beginPath();c.moveTo(x-w,y+h);c.lineTo(x,y+2*h);c.lineTo(x,y+2*h+z);c.lineTo(x-w,y+h+z);c.fill();c.fillStyle='#466c58';c.beginPath();c.moveTo(x+w,y+h);c.lineTo(x,y+2*h);c.lineTo(x,y+2*h+z);c.lineTo(x+w,y+h+z);c.fill();}}
function cat(x,y,col='#dfac62'){rect(x-24,y-52,48,64,col,9);c.fillStyle=col;c.beginPath();c.moveTo(x-24,y-48);c.lineTo(x-24,y-74);c.lineTo(x-5,y-49);c.moveTo(x+24,y-48);c.lineTo(x+24,y-74);c.lineTo(x+5,y-49);c.fill();text('• •',x,y-25,20,'#263a35');}
function scenery(i,s){c.save();c.translate(i*960,0);rect(0,0,960,1080,'#d6e5d7');const sky=c.createLinearGradient(0,90,0,900);sky.addColorStop(0,'#e1eff0');sky.addColorStop(.58,'#b8d6c2');sky.addColorStop(1,'#9abf99');rect(0,90,960,805,sky);for(let n=0;n<7;n++){const x=70+n*144;rect(x,290-n%3*35,12,100,'#749768');c.fillStyle='#7da587';c.beginPath();c.arc(x+6,295-n%3*35,38,0,Math.PI*2);c.fill();}text(i?'응답을 구분한 설계':'비교 기준',480,123,33,i?'#245e46':'#566c62');
 if(mode==='receipt'||mode==='context'){for(let row=0;row<5;row++)for(let col=0;col<6;col++)iso(475+(col-row)*65,385+(col+row)*33,64,32,12,(col+row)%2?'#a8c891':'#b8d4a3');const dx=568,dy=395;rect(dx,dy,150,210,'#718271',8);rect(dx+15,dy+15,120,180,s.open?'#bccca2':'#876d53');if(!s.open){rect(dx+60,dy+65,32,39,'#d5c095',5);text('🔒',dx+76,dy+81,30);}else text('열림',dx+74,dy+100,31);cat(145+s.x,651,'#e4bb75');if(!s.hasKey){text('열쇠',573,717,25);text('⚿',573,679,57,'#b79741');}text(s.hasKey?'열쇠 있음':'열쇠 없음',150,237,29);if(mode==='context'&&s.paused){rect(178,300,605,280,'#eff5ed',12);text('일시 정지',480,355,46);text('SPACE · 계속하기',480,454,35,'#245e46');}
 }else if(mode==='blocked'){for(let row=0;row<4;row++)for(let col=0;col<5;col++){const x=475+(col-row)*69,y=330+(col+row)*36;iso(x,y,67,34,16,(row+col)%2?'#afcd99':'#c0d9aa');if(s.buildings.some(b=>b.col===col&&b.row===row)){rect(x-28,y-62,56,81,'#749392',5);rect(x-18,y-42,20,30,'#e8dcaa');}if(col===s.col&&row===s.row){c.strokeStyle=s.buildings.some(b=>b.col===col&&b.row===row)||s.wood<4?(t<s.blockedPulseUntil?'#e05836':'#b56546'):'#20734f';c.lineWidth=t<s.blockedPulseUntil?14:8;c.beginPath();c.moveTo(x,y);c.lineTo(x+67,y+34);c.lineTo(x,y+68);c.lineTo(x-67,y+34);c.closePath();c.stroke();}}cat(234,752);text(`나무 ${s.wood} / 건설 비용 4`,480,240,33);text('방향키 · 위치 선택     SPACE · 건설     E · 재료 수집',480,828,25);
 }else if(mode==='menu'){if(s.menu){rect(155,264,650,441,'#f5f1e0',12);text('작은 숲 탐험',480,322,46);['탐험 시작','연습 모드'].forEach((v,n)=>{rect(217,390+n*115,526,80,s.selection===n?'#3e7761':'#dce6d7',8);text(v,480,429+n*115,36,s.selection===n?'white':'#55665e');});text(i?'ENTER / SPACE · 확인':'ENTER · 확인',480,659,29);}else{for(let n=0;n<5;n++)iso(480,378+n*57,155+n*25,53,15,'#a8c592');cat(480+Math.sin(t*.7)*60,631);text(s.selection?'연습 중':'탐험 중',480,285,45,'#245e46');}text('방향키 · 선택     ESC · 메뉴',480,824,28);
 }else if(mode==='cutscene'){const camera=s.story;rect(70,256,820,444,'#dae6d2',12);for(let n=0;n<8;n++){const x=((n*145-camera*40)%1000+1000)%1000-50;rect(x,415,15,125,'#76916a');c.fillStyle='#7fa584';c.beginPath();c.arc(x+6,410,35,0,Math.PI*2);c.fill();}rect(0,643,960,60,'#77977d');rect(405,577,159,80,'#cd9859',15);for(let x of [434,536]){c.fillStyle='#43564b';c.beginPath();c.arc(x,658,24,0,Math.PI*2);c.fill();}cat(490,600);if(s.skipAt){rect(173,300,615,240,'#edf4e8',12);text('다음 장면',480,384,55,'#245e46');text('확인 완료 후에만 전환',480,477,28);}else{text('숲으로 가는 길',480,272,37);if(i&&t<s.promptUntil){text('SPACE · 길게 눌러 건너뛰기',480,750,31);rect(220,790,520,22,'#9bb49e',5);rect(220,790,520*Math.min(s.progress/1.2,1),22,'#3c7358',5);}}text('R · 장면 다시 시작',480,844,25);
 }else if(mode==='pending'){for(let n=0;n<3;n++)iso(480,400+n*70,220,67,18,'#abc896');cat(480,668);rect(152,225,655,162,'#f5f1de',12);text(i&&s.pending?'저장 중…':s.saves?'저장 완료':'탐험 기록',480,278,43,s.pending?'#aa7445':'#326349');text(`완료된 요청 ${s.saves}회`,480,341,28);if(i&&s.pending){for(let n=0;n<3;n++){c.fillStyle='#557d63';c.beginPath();c.arc(450+n*30,750+Math.sin(t*4+n)*4,7,0,Math.PI*2);c.fill();}}text('SPACE · 모의 저장 요청 ('+pendingSeconds+'초 처리)',480,831,28);
 }
 if(t<s.messageUntil){const w=Math.min(830,Math.max(330,s.message.length*33+70)),messageY=['receipt','blocked','context'].includes(mode)?150:170;rect(480-w/2,messageY,w,65,i?'#fff4c9':'#eef1df',8);text(s.message,480,messageY+31,30);}
 c.restore();}
function draw(){c.clearRect(0,0,1920,1080);for(let i=0;i<2;i++)scenery(i,states[i]);rect(0,0,1920,85,'#203e33');text('INPUT STATE WORKSHOP · '+names[mode],52,42,34,'#f1f5e6','left');rect(951,85,18,805,'#779382');rect(0,895,1920,185,'#c8dac0');text('직접 제작한 실제 입력 비교 · 상용 게임 규칙을 재현한 화면이 아닙니다',960,868,23,'#486553');const active=[...keys].join(' + ')||'—';text('입력 '+active,1785,42,24,'#f1f5e6');}
window.captureStep=function(now){const dt=Math.max(0,now-last);last=t=now;for(let i=0;i<2;i++){const s=states[i];if(mode==='receipt'){if(keys.has('ArrowRight'))s.x=Math.min(480,s.x+150*dt);if(keys.has('ArrowLeft'))s.x=Math.max(0,s.x-150*dt);}if(mode==='cutscene'){s.story+=dt;if(keys.has('Space')&&!s.skipAt){s.progress+=dt;if(s.progress>=1.2){s.skipAt=t;window.outcomeLog.push({t,panel:i,kind:'skipped',heldSeconds:s.progress});feedback(i,'건너뛰기 확인 완료','complete');}}}if(mode==='pending'&&s.pending&&t>=s.doneAt){s.pending=false;s.saves++;window.outcomeLog.push({t,panel:i,kind:'save-complete',saves:s.saves});feedback(i,'저장 완료','complete');}}draw();};
window.testState=()=>JSON.parse(JSON.stringify(states));window.captureStep(0);
</script></html>
