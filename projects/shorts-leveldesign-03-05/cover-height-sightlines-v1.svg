  <text x="874" y="1104" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#ffdb79" text-anchor="middle">순찰 적</text>
  <text x="388" y="1366" font-family="Malgun Gothic, sans-serif" font-size="35" font-weight="700" fill="#fff" text-anchor="middle">몸 표본점</text>
  <text x="62" y="1434" font-family="Malgun Gothic, sans-serif" font-size="39" font-weight="700" fill="#edf5ef" text-anchor="start">입구에서 순찰이 보임 · 몸 일부는 가려짐</text>
</svg>
