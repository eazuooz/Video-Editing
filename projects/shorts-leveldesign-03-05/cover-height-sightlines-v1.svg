<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
  <title>Occlusion (가림) 엄폐물 높이 비교</title>
  <desc>입구에서 순찰 적을 바라보는 선과 적의 시점에서 몸으로 향하는 선을 따로 표시한다.</desc>
  <rect x="0" y="0" width="1080" height="1920" fill="#101010" />
  <text x="62" y="120" font-family="Malgun Gothic, sans-serif" font-size="60" font-weight="700" fill="#ffdb79" text-anchor="start">Occlusion (가림)</text>
  <text x="62" y="205" font-family="Malgun Gothic, sans-serif" font-size="42" font-weight="700" fill="#fff" text-anchor="start">같은 방에서 엄폐물 높이만 바꾼다</text>
  <text x="62" y="275" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#d8dfda" text-anchor="start">청록 · 입구 시선     노랑 · 적 시선</text>
  <text x="62" y="425" font-family="Malgun Gothic, sans-serif" font-size="48" font-weight="700" fill="#fff" text-anchor="start">A  높은 엄폐물</text>
  <line x1="90" y1="744" x2="975" y2="744" stroke="#59645e" stroke-width="5" />
  <rect x="423" y="503" width="44" height="241" fill="#496359" />
  <line x1="423" y1="576" x2="874" y2="592" stroke="#505956" stroke-width="6" />
  <line x1="104" y1="565" x2="423" y2="576" stroke="#85eac2" stroke-width="8" />
  <circle cx="423" cy="576" r="9" fill="#f7a391" />
  <line x1="467" y1="660" x2="388" y2="679" stroke="#505956" stroke-width="6" />
  <line x1="874" y1="565" x2="467" y2="660" stroke="#ffdb79" stroke-width="8" />
  <circle cx="467" cy="660" r="9" fill="#f7a391" />
  <line x1="467" y1="625" x2="388" y2="636" stroke="#505956" stroke-width="6" />
  <line x1="874" y1="565" x2="467" y2="625" stroke="#ffdb79" stroke-width="8" />
  <circle cx="467" cy="625" r="9" fill="#f7a391" />
  <circle cx="104" cy="565" r="12" fill="#85eac2" />
  <circle cx="874" cy="565" r="12" fill="#ffdb79" />
  <circle cx="388" cy="716" r="8" fill="#e9eee9" />
  <circle cx="388" cy="679" r="8" fill="#e9eee9" />
  <circle cx="388" cy="636" r="8" fill="#e9eee9" />
  <text x="104" y="539" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#85eac2" text-anchor="middle">입구</text>
  <text x="874" y="539" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#ffdb79" text-anchor="middle">순찰 적</text>
  <text x="388" y="801" font-family="Malgun Gothic, sans-serif" font-size="35" font-weight="700" fill="#fff" text-anchor="middle">몸 표본점</text>
  <text x="62" y="869" font-family="Malgun Gothic, sans-serif" font-size="39" font-weight="700" fill="#edf5ef" text-anchor="start">입구에서 순찰이 가려짐</text>
  <text x="62" y="990" font-family="Malgun Gothic, sans-serif" font-size="48" font-weight="700" fill="#fff" text-anchor="start">B  낮은 엄폐물</text>
  <line x1="90" y1="1309" x2="975" y2="1309" stroke="#59645e" stroke-width="5" />
  <rect x="423" y="1214" width="44" height="95" fill="#496359" />
  <line x1="104" y1="1130" x2="874" y2="1157" stroke="#85eac2" stroke-width="8" />
