<!doctype html><html lang="ko"><meta charset="utf-8"><title>얌얌코딩 · 백지에서 구현하기</title><link rel="stylesheet" href="style.css"><body>
<header><b>얌얌코딩 <span>개발 실습</span></b><label id="mode-title">연결 리스트</label><small>이번 영상을 위한 자체 제작 예제 · 교육용 재연</small></header>
<nav><button data-mode="cpp">C++ / Linked List</button><button data-mode="blocks">낙하 블록</button><button data-mode="breakout">벽돌 깨기</button><button id="view-toggle">코드 + 실행 / 전체 실행</button></nav>
<main><section id="editor-panel"><div class="bar"><b id="filename">lesson.cpp</b><select id="lesson"></select><button id="blank">새 파일</button></div><textarea id="editor" spellcheck="false" aria-label="실행할 소스 코드"></textarea><div class="tools"><button id="run">저장 · 빌드 · 실행</button><button id="debug">중단점 켜기</button><button id="step">단계 실행</button><button id="reset">초기화</button></div><div id="source-note">실제 MSVC 컴파일 · inspect에서 실행을 멈추는 계측 디버거</div></section>
<section id="runtime"><div class="bar"><b id="runtime-title">실행 중 변수</b><span id="status">준비</span><button id="return-editor" onclick="document.getElementById('view-toggle').click()">코드 열기</button></div><div id="watch"></div><div id="play-area"><canvas id="game" width="1050" height="750"></canvas></div><div id="controls"><button data-input="left">← 왼쪽</button><button data-input="right">오른쪽 →</button><button data-input="down">↓ 내리기</button><button data-input="rotate">↻ 회전</button><button data-input="drop">바닥에 놓기</button></div><div id="scenarios"><button data-scenario="empty">빈 보드</button><button data-scenario="right-wall">오른쪽 벽</button><button data-scenario="left-wall">왼쪽 벽</button><button data-scenario="occupied">쌓인 블록</button><button data-scenario="one-row">한 줄</button><button data-scenario="two-rows">두 줄</button><button data-scenario="separate">떨어진 줄</button><button data-scenario="paddle-center">패들 중앙</button><button data-scenario="paddle-edge">패들 끝</button></div></section></main>
<footer><b>실행 기록</b><pre id="output"></pre></footer><script type="module" src="app.js"></script></body></html>
