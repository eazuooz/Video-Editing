<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>얌얌 LOFI ROOM</title><link rel="stylesheet" href="room.css"></head>
<body><main><header><strong>얌얌코딩 <span>LOFI ROOM</span></strong><p id="phase" aria-live="polite">숲이 보이는 작은 방</p><button id="fullscreen">전체 화면</button></header>
<section id="stage" aria-label="로파이 방"><canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="3D 로파이 방"></canvas>
<div id="welcome"><div><p class="eyebrow">A LITTLE ROOM TO SLOW DOWN</p><h1>오늘은 조금,<br>천천히 쉬어가요.</h1><p>달빛 숲과 따뜻한 벽난로, 책 한 권과 로파이.</p><progress id="progress" max="1" value="0"></progress><p id="loading" role="status">방을 준비하고 있어요…</p><button id="enter" disabled>방 준비 중</button><button id="retry" hidden>다시 불러오기</button></div></div>
<aside id="sound"><label>오늘의 로파이 <select id="music-track" aria-label="로파이 곡 선택"><option value="0">Morning Coffee</option><option value="1">Glad To Be Stuck Inside</option><option value="2">Laundry On The Wire</option><option value="3">A Little Shade</option><option value="4">Keeping Cool</option><option value="5">Come Again</option><option value="6">Windows Down</option><option value="7">Waves</option><option value="8">Something In the Air</option><option value="9">Everything You Ever Dreamed</option></select></label><div class="music-navigation"><button data-action="PreviousTrack" aria-label="이전 곡">이전</button><button data-action="ToggleMusic" aria-label="음악 재생 또는 일시정지">재생 / 정지</button><button data-action="NextTrack" aria-label="다음 곡">다음</button></div><label>로파이 <input id="music-volume" aria-label="로파이 음량" type="range" min="0" max="0.6" step="0.01" value="0.18"></label><label>장작 <input id="fire-volume" aria-label="장작 음량" type="range" min="0" max="0.7" step="0.01" value="0.42"></label><small id="audio-state">소리는 시작 버튼을 누르면 켜져요</small></aside>
<nav id="actions" aria-label="방 조작"><button data-action="Walk">산책</button><button data-action="Idle">일어나기</button><button data-action="Sit">아이맥</button><button id="read">독서</button><button data-action="ToggleNight">낮 / 밤</button><button data-action="ToggleRain">비</button><button data-action="CameraDesk">책상</button><button data-action="CameraRoom">방 전체</button><button data-action="CameraBeanbag">소파 보기</button><button data-action="CameraCat">고양이 보기</button><button data-action="CameraRecord">레코드 보기</button><button data-action="ToggleMusic">음악</button><button id="memo-open">메모</button><button id="timer-open">집중</button></nav>
<section id="memo-panel" class="paper" hidden aria-label="오늘의 메모"><div class="panel-title"><h2>오늘의 메모</h2><button id="memo-close">닫기</button></div><label for="memo-text">적어두고 싶은 생각을 편하게 남겨두세요.</label><textarea id="memo-text" maxlength="12000" placeholder="오늘의 할 일, 떠오른 아이디어…"></textarea><p id="memo-state" role="status">이 브라우저에 자동 저장됩니다.</p><small>같은 주소·브라우저에 저장돼요. 브라우저 데이터를 지우면 메모도 지워질 수 있어요.</small></section>
<section id="timer-panel" class="paper" hidden aria-label="집중 타이머"><div class="panel-title"><h2>잠깐 집중하기</h2><button id="timer-close">닫기</button></div><label>집중 시간 <select id="timer-length"><option value="25">25분</option><option value="15">15분</option><option value="5">5분</option></select></label><output id="timer-clock">25:00</output><button id="timer-toggle">시작</button><button id="timer-reset">처음부터</button><p id="timer-state" role="status">할 일 하나를 정하고 시작해 보세요.</p></section></section>
<footer>메모와 설정은 이 브라우저에만 저장돼요. <button id="quality">화질: 기본</button> <span id="performance"></span> <a href="credits.html">사용 자산·음악</a></footer></main><script src="build-config.js"></script><script src="room.js"></script></body></html>
