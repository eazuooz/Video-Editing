  <text x="79" y="147" fill="#F8D576" font-size="56" font-weight="700" font-family="Malgun Gothic, sans-serif">몸은 지나가도 카메라는?</text>
  <text x="79" y="224" fill="#B9C6BE" font-size="38" font-weight="400" font-family="Malgun Gothic, sans-serif">같은 몸과 카메라, 달라지는 것은 통로 폭</text>
