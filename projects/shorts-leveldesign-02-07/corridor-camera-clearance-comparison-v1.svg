<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">몸과 카메라에 필요한 통로 폭</title>
  <desc id="desc">같은 플레이어와 카메라의 위치를 두고 통로 폭을 바꾼 단면 모형이다.</desc>
