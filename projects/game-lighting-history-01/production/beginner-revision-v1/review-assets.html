<!doctype html><html lang="ko"><meta charset="utf-8"><title>보강 설명 · 현재 자막과 동작 검수</title><style>
@font-face{font-family:cap;src:url('../local/final-edit-v1/fonts/YamYamCaptionMedium.ttf')}*{box-sizing:border-box}body{background:#171717;color:white;font:16px Arial;margin:12px}header{display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:4;background:#171717;padding:10px}button,select{font-size:17px;padding:6px}#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cell{min-width:0}.view{aspect-ratio:16/9;position:relative;background:black;overflow:hidden}.view video{width:100%;height:100%;object-fit:contain}.cap{position:absolute;left:50%;top:89.8148%;transform:translate(-50%,-50%);background:white;color:#090b08;padding:.55% 1.15%;border:1px solid #161b18;box-shadow:5px 5px #073c32;text-align:center;font-family:cap;white-space:pre;width:max-content;max-width:87%;font-size:clamp(10px,1.17vw,24px);line-height:1.29}.captionInfo{font:13px monospace;height:25px}.status{white-space:pre-wrap;font-size:13px}</style>
<header><select aria-label="검수 묶음" id="group"></select><button id="play">처음부터 정상 재생</button><button id="pause">일시정지</button><button id="middle">중간</button><button id="end">마지막 프레임</button><span id="clock"></span></header><main id="grid"></main><pre id="status"></pre>
<script src="../local/beginner-revision-v1/review-assets-data.js"></script><script>
const group=document.querySelector('#group'),grid=document.querySelector('#grid'),clock=document.querySelector('#clock');let views=[];
for(let i=0;i<reviewAssets.groups.length;i++){const o=document.createElement('option');o.value=i;o.textContent='묶음 '+(i+1)+' · '+reviewAssets.groups[i].map(n=>n.id).join(', ');group.append(o)}
function choose(){for(const x of views)x.video.pause();views=[];grid.replaceChildren();for(const n of reviewAssets.groups[+group.value]){const cell=document.createElement('section');cell.className='cell';const label=document.createElement('div');label.textContent=n.id+' · '+n.role+' · '+(n.frames/60).toFixed(2)+'초';const box=document.createElement('div');box.className='view';const v=document.createElement('video');v.muted=true;v.preload='auto';v.src='../../../../'+n.framedPath;const cap=document.createElement('div');cap.className='cap';cap.hidden=true;const info=document.createElement('div');info.className='captionInfo';box.append(v,cap);cell.append(label,box,info);grid.append(cell);v.addEventListener('loadedmetadata',()=>{v.currentTime=n.framedStartFrame/60;});views.push({node:n,video:v,cap,info})}document.querySelector('#status').textContent=reviewAssets.groups[+group.value].map(n=>n.id+': '+(n.focusKo||n.text||'')).join('\n')}
group.onchange=choose;document.querySelector('#play').onclick=()=>{for(const x of views){x.video.currentTime=x.node.framedStartFrame/60;x.video.playbackRate=1;x.video.play()}};document.querySelector('#pause').onclick=()=>views.forEach(x=>x.video.pause());for(const [id,f] of [['middle',.5],['end',1]])document.querySelector('#'+id).onclick=()=>{for(const x of views){x.video.pause();x.video.currentTime=(x.node.framedStartFrame+Math.floor((x.node.frames-1)*f))/60}};
function tick(){for(const x of views){const local=x.video.currentTime-x.node.framedStartFrame/60;const global=local+x.node.startFrame/60;if(local>=x.node.frames/60){x.video.pause();x.video.currentTime=(x.node.framedStartFrame+x.node.frames-1)/60}const c=reviewAssets.cues.find(c=>c.startSeconds<=global&&global<c.endSeconds);x.cap.hidden=!c;if(c)x.cap.textContent=c.lines.join('\n');x.info.textContent=local.toFixed(2)+'s · '+(x.video.paused?'일시정지':'1× 재생')+(x.video.error?' ERROR '+x.video.error.code:'')}clock.textContent=views.map(x=>x.node.id+':'+(x.video.currentTime-x.node.framedStartFrame/60).toFixed(1)).join(' ');requestAnimationFrame(tick)}choose();tick();
</script></html>
