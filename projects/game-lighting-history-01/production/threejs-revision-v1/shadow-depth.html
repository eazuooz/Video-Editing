<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>렌더링 역사 1편 · Three.js 그림자 설명</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f5f5f5;font:16px 'Malgun Gothic',sans-serif}nav{padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}button,select{font:inherit;color:#f5f5f5;background:#263238;border:1px solid #5e727a;border-radius:4px;padding:8px 14px}label{display:flex;align-items:center;gap:10px}input{width:210px}#wrap{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:black}#stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;background:#000}h1{position:absolute;top:45px;left:96px;margin:0;font-size:54px;color:#e8cf83;font-weight:600}#subtitle{position:absolute;top:126px;left:98px;font-size:30px;color:#b8b8b8}canvas{position:absolute;top:210px;left:90px;width:1740px;height:570px}.label{position:absolute;font-size:30px;top:173px}.left{left:100px}.right{left:1320px}#readout{position:absolute;top:800px;left:96px;font-size:34px;color:#73c7c2}#meaning{position:absolute;top:855px;left:96px;font-size:28px;color:#e8cf83}#caption{position:absolute;left:960px;top:970px;transform:translate(-50%,-50%);font-size:48px;line-height:1.15;text-align:center;white-space:pre;width:max-content;max-width:1728px;background:rgba(255,255,255,.96);color:#183c2a;border-radius:8px;padding:10px 22px;box-shadow:0 5px 12px #000b}#point-label{position:absolute;font-size:30px;color:#ffd666;text-shadow:0 2px 3px #000;pointer-events:none}#error{position:absolute;inset:240px 120px;color:#ff9b9b;font-size:32px;white-space:pre-wrap}footer{padding:12px 20px;color:#b8b8b8}
</style>
<nav><button id="play">동작 재생</button><button id="reset">처음 상태</button><label>가림 물체 위치<input id="occluder" type="range" min="-2" max="2" step="0.01" value="0"></label><label>관찰 화면<select id="mode"><option value="shadow">그림자 + 광원 깊이</option><option value="normal">표면 법선 + 광원 깊이</option></select></label></nav>
<div id="wrap"><main id="stage"><h1>그림자는 같은 깊이 좌표를 비교해서 찾습니다</h1><div id="subtitle">광원과 카메라를 고정하고, 가림 물체 하나만 움직여 봅니다.</div><div class="label left">관찰자 시점 · 노란 점 P가 빛을 받는가?</div><div class="label right">광원 시점 · 실제 깊이 패스</div><canvas id="render"></canvas><div id="point-label">P</div><div id="readout">Three.js 초기화 중</div><div id="meaning">흰색에 가까울수록 멀리 있는 표면 · 단위 없는 정규화 깊이</div><div id="caption">섀도 맵은 광원의 자리에서 깊이를 저장합니다.
한 방향에서 처음 보이는 표면이 얼마나</div><div id="error" hidden></div></main></div>
<footer>내부 대표 동작 샘플 · Three.js 실제 메시/깊이 패스. 광선·노란 점은 교육용 표식. 최종 영상·전체 장면 검수 전.</footer>
<script type="module" src="./shadow-depth.mjs"></script>
</html>
