<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">보급 연결을 바꾸면 준비 순서가 달라진다</title>
  <desc id="desc">전투 경로와 원의 위치를 고정한다. 위는 출구에 보급, 아래는 접근부에 보급이 직접 연결된다.</desc>
  <rect width="1080" height="1920" fill="#101412" />
  <text x="78" y="150" fill="#F9D675" font-size="59" font-family="Malgun Gothic, sans-serif" font-weight="700">보급을 언제 받을 수 있을까?</text>
  <text x="78" y="225" fill="#AEBEB5" font-size="37" font-family="Malgun Gothic, sans-serif" font-weight="400">원의 자리와 기본 경로는 그대로</text>
  <g id="exit-linked">
    <text x="79" y="318" fill="#71DDDE" font-size="40" font-family="Malgun Gothic, sans-serif" font-weight="700">A</text>
    <text x="137" y="318" fill="#EEF4F0" font-size="43" font-family="Malgun Gothic, sans-serif" font-weight="700">출구에 보급 연결</text>
    <line x1="135" y1="468" x2="405" y2="468" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
    <polyline points="258,453 282,468 258,483" fill="none" stroke="#71DDDE" stroke-width="7" stroke-linejoin="round" />
    <line x1="405" y1="468" x2="675" y2="468" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
    <polyline points="528,453 552,468 528,483" fill="none" stroke="#71DDDE" stroke-width="7" stroke-linejoin="round" />
    <line x1="675" y1="468" x2="945" y2="468" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
    <polyline points="798,453 822,468 798,483" fill="none" stroke="#71DDDE" stroke-width="7" stroke-linejoin="round" />
    <line x1="945" y1="468" x2="675" y2="643" stroke="#9FE28C" stroke-width="11" stroke-linecap="round" />
    <circle cx="135" cy="468" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="135" y="481" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">시작</text>
    <circle cx="405" cy="468" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="405" y="481" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">접근부</text>
    <circle cx="675" cy="468" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="675" y="481" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">전투장</text>
    <circle cx="945" cy="468" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="945" y="481" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">출구</text>
    <circle cx="675" cy="643" r="68" fill="#101412" stroke="#9FE28C" stroke-width="7" />
    <text x="675" y="656" fill="#9FE28C" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">보급</text>
    <text x="79" y="772" fill="#EEF4F0" font-size="34" font-family="Malgun Gothic, sans-serif" font-weight="400">전투를 지나야 보급에 도달</text>
  </g>
  <g id="approach-linked">
    <text x="79" y="865" fill="#71DDDE" font-size="40" font-family="Malgun Gothic, sans-serif" font-weight="700">B</text>
    <text x="137" y="865" fill="#EEF4F0" font-size="43" font-family="Malgun Gothic, sans-serif" font-weight="700">접근부에 보급 연결</text>
    <line x1="135" y1="1015" x2="405" y2="1015" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
    <polyline points="258,1000 282,1015 258,1030" fill="none" stroke="#71DDDE" stroke-width="7" stroke-linejoin="round" />
    <line x1="405" y1="1015" x2="675" y2="1015" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
    <polyline points="528,1000 552,1015 528,1030" fill="none" stroke="#71DDDE" stroke-width="7" stroke-linejoin="round" />
    <line x1="675" y1="1015" x2="945" y2="1015" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
    <polyline points="798,1000 822,1015 798,1030" fill="none" stroke="#71DDDE" stroke-width="7" stroke-linejoin="round" />
    <line x1="405" y1="1015" x2="675" y2="1190" stroke="#9FE28C" stroke-width="11" stroke-linecap="round" />
    <circle cx="135" cy="1015" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="135" y="1028" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">시작</text>
    <circle cx="405" cy="1015" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="405" y="1028" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">접근부</text>
    <circle cx="675" cy="1015" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="675" y="1028" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">전투장</text>
    <circle cx="945" cy="1015" r="68" fill="#101412" stroke="#465A50" stroke-width="7" />
    <text x="945" y="1028" fill="#EEF4F0" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">출구</text>
    <circle cx="675" cy="1190" r="68" fill="#101412" stroke="#9FE28C" stroke-width="7" />
    <text x="675" y="1203" fill="#9FE28C" font-size="36" font-family="Malgun Gothic, sans-serif" font-weight="700" text-anchor="middle">보급</text>
    <text x="79" y="1319" fill="#EEF4F0" font-size="34" font-family="Malgun Gothic, sans-serif" font-weight="400">전투 전에 보급에 들를 수 있음</text>
  </g>
  <line x1="79" y1="1375" x2="1001" y2="1375" stroke="#465A50" stroke-width="2" stroke-linecap="round" />
  <line x1="79" y1="1444" x2="140" y2="1444" stroke="#71DDDE" stroke-width="8" stroke-linecap="round" />
  <text x="159" y="1458" fill="#EEF4F0" font-size="34" font-family="Malgun Gothic, sans-serif" font-weight="400">기본 이동 경로</text>
  <line x1="565" y1="1444" x2="626" y2="1444" stroke="#9FE28C" stroke-width="11" stroke-linecap="round" />
  <text x="648" y="1458" fill="#EEF4F0" font-size="34" font-family="Malgun Gothic, sans-serif" font-weight="400">보급 직접 연결</text>
</svg>
