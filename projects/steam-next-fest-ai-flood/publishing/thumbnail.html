<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>steam-next-fest-ai-flood thumbnail</title>
<style>
  /* Channel thumbnail layout (yellow header strip, white ground, heavy black headline,
     one yellow-highlighted line, red emphasis, original cat logo). 1280x720. */
  html,body{margin:0;background:#fff;width:1280px;height:720px;overflow:hidden;font-family:"Malgun Gothic","맑은 고딕",sans-serif}
  .frame{position:relative;width:1280px;height:720px;border:14px solid #FFD400;box-sizing:border-box;background:#fff}
  .strip{position:absolute;left:0;top:0;width:1252px;height:66px;background:#FFD400;display:flex;align-items:center;padding-left:28px;box-sizing:border-box;font-weight:900;font-size:26px;color:#111}
  .strip .en{margin-left:36px;font-size:20px;font-weight:800}
  .logo{position:absolute;right:16px;top:8px;width:50px;height:50px;border-radius:50%;object-fit:cover;background:#fff}
  .h1{position:absolute;left:34px;top:80px;font-size:100px;line-height:1.02;font-weight:900;color:#111;letter-spacing:-4px}
  .h2{position:absolute;left:34px;top:196px;font-size:86px;line-height:1.05;font-weight:900;color:#111;letter-spacing:-3px;background:#FFD400;padding:0 14px 6px 10px}
  .h2 b{color:#D11A1A}
  .sub{position:absolute;left:38px;top:318px;font-size:38px;font-weight:800;color:#222}
  .tag{position:absolute;left:38px;top:392px;background:#111;color:#FFD400;font-weight:900;font-size:34px;padding:8px 22px}
  .fact{position:absolute;left:38px;top:500px;display:flex;gap:18px;align-items:center}
  .fact .box{border:4px solid #111;font-weight:900;font-size:40px;padding:8px 20px;background:#fff}
  .fact .arrow{font-size:44px;font-weight:900}
  .fact .box.red{border-color:#D11A1A;color:#D11A1A}
  .fact small{display:block;font-size:20px;font-weight:800;color:#444;letter-spacing:0}
  .sky{position:absolute;right:70px;top:300px;width:370px;height:370px}
  .cat{position:absolute;right:34px;top:496px;width:196px;height:196px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 8px #fff}
  .bubble{position:absolute;right:440px;top:350px;background:#FFF3A8;border:3px solid #111;border-radius:14px;padding:10px 18px;font-weight:900;font-size:28px;color:#111;white-space:nowrap}
  .bubble:after{content:"";position:absolute;right:-16px;top:22px;border:10px solid transparent;border-left-color:#111}
</style></head><body><div class="frame">
  <div class="strip">얌얌코딩 &nbsp;|&nbsp; AI 게임 개발의 미래 <span class="en">Game Dev</span></div>
  <img class="logo" src="../../../shared/assets/branding/yamyamcoding-cats-original.png">
  <div class="h1">데모 8배 늘었는데</div>
  <div class="h2">왜 <b>더 좋은 게임</b>은 없을까?</div>
  <div class="sub">AI 3년, 유저에게 돌아온 것</div>
  <div class="tag">실제 파악</div>
  <div class="fact">
    <div class="box">1,000개<small>2023 넥스트 페스트</small></div><div class="arrow">→</div>
    <div class="box red">8,000개<small>2026 넥스트 페스트</small></div>
  </div>
  <!-- Concept illustration: a night sky of 8,000 "stars" (demos) and a magnifying glass finding one. Drawn here, not a video frame. -->
  <svg class="sky" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="c"><circle cx="260" cy="230" r="215"/></clipPath>
      <radialGradient id="g" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#1b2a5a"/><stop offset="1" stop-color="#070b1f"/></radialGradient></defs>
    <circle cx="260" cy="230" r="215" fill="url(#g)" stroke="#111" stroke-width="8"/>
    <g clip-path="url(#c)" id="stars"></g>
    <!-- magnifying glass over one bright star -->
    <circle cx="318" cy="186" r="12" fill="#FFD400"/>
    <circle cx="318" cy="186" r="74" fill="none" stroke="#FFD400" stroke-width="12"/>
    <circle cx="318" cy="186" r="74" fill="none" stroke="#111" stroke-width="4"/>
    <line x1="372" y1="240" x2="452" y2="320" stroke="#111" stroke-width="30" stroke-linecap="round"/>
    <line x1="372" y1="240" x2="452" y2="320" stroke="#FFD400" stroke-width="18" stroke-linecap="round"/>
  </svg>
  <div class="bubble">하늘의 별따기?</div>
  <img class="cat" src="../../../shared/assets/branding/yamyamcoding-cats-original.png">
</div>
<script>
  // deterministic star field (seeded) so the PNG is reproducible
  let s=20261021; const rnd=()=>{s=(s*1103515245+12345)%2147483648; return s/2147483648};
  const g=document.getElementById('stars'); let html='';
  for(let i=0;i<900;i++){const x=45+rnd()*430,y=15+rnd()*430,r=rnd()<0.08?2.6:1.3,o=0.35+rnd()*0.65; html+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#fff" opacity="${o.toFixed(2)}"/>`;}
  g.innerHTML=html;
</script></body></html>
