  <line x1="148" y1="505" x2="408" y2="505" stroke="#8bebbb" stroke-width="15" stroke-linecap="round" />
  <line x1="408" y1="505" x2="668" y2="505" stroke="#8bebbb" stroke-width="15" stroke-linecap="round" />
  <line x1="668" y1="505" x2="928" y2="505" stroke="#8bebbb" stroke-width="15" stroke-linecap="round" />
  <circle cx="148" cy="505" r="17" fill="#e5e5e5" />
  <circle cx="408" cy="505" r="17" fill="#e5e5e5" />
  <circle cx="928" cy="505" r="17" fill="#e5e5e5" />
  <circle cx="928" cy="723" r="17" fill="#e5e5e5" />
  <circle cx="668" cy="505" r="35" fill="#151515" />
  <circle cx="668" cy="505" r="25" fill="#ff9d88" />
  <text x="668" y="457" font-family="Malgun Gothic, sans-serif" font-size="40" font-weight="700" fill="#ff9d88" text-anchor="middle">함정</text>
  <text x="148" y="584" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">적의 출발</text>
  <text x="408" y="462" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">갈림길</text>
  <text x="928" y="467" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">본길</text>
  <text x="928" y="680" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">옆길</text>
