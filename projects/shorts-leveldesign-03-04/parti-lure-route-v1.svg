  <circle cx="408" cy="1090" r="17" fill="#e5e5e5" />
  <circle cx="928" cy="1090" r="17" fill="#e5e5e5" />
  <circle cx="928" cy="1308" r="17" fill="#e5e5e5" />
  <circle cx="668" cy="1308" r="35" fill="#151515" />
  <circle cx="668" cy="1308" r="25" fill="#ff9d88" />
  <text x="668" y="1260" font-family="Malgun Gothic, sans-serif" font-size="40" font-weight="700" fill="#ff9d88" text-anchor="middle">함정</text>
  <text x="148" y="1169" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">적의 출발</text>
  <text x="408" y="1047" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">갈림길</text>
  <text x="928" y="1052" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">본길</text>
  <text x="928" y="1265" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700" fill="#ffffff" text-anchor="middle">옆길</text>
  <text x="64" y="1429" font-family="Malgun Gothic, sans-serif" font-size="44" font-weight="700" fill="#8bebbb" text-anchor="start">갈림길에서 방향을 바꿈</text>
