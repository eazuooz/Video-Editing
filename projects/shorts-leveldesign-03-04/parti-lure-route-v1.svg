<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
  <title>Parti (파르티) 본길과 옆길</title>
  <desc>같은 갈림길과 유인 규칙을 놓고 게임 함정의 위치만 바꾼다. 위치에 따라 적을 데려갈 길이 달라진다.</desc>
  <rect x="0" y="0" width="1080" height="1920" fill="#101010" />
  <text x="64" y="122" font-family="Malgun Gothic, sans-serif" font-size="63" font-weight="700" fill="#ffdb79" text-anchor="start">Parti (파르티)</text>
  <text x="64" y="210" font-family="Malgun Gothic, sans-serif" font-size="41" font-weight="700" fill="#ffffff" text-anchor="start">함정 위치가 유인 경로를 바꾼다</text>
  <text x="64" y="357" font-family="Malgun Gothic, sans-serif" font-size="49" font-weight="700" fill="#ffffff" text-anchor="start">A  본길의 함정</text>
