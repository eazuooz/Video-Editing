<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>2D / 2.5D 비교 샘플</title><style>body{font:17px 'Malgun Gothic',sans-serif;margin:24px;color:#202020;background:white}main{max-width:1440px;margin:auto}canvas{width:100%;height:auto}button{font:inherit;padding:12px;margin:8px;border:1px solid #cbd0d6;background:#f2f4f7}p{color:#737373}</style></head><body><main><h1>2D와 2.5D — 같은 행동, 다른 공간감</h1><p>12초 무음 스타일 비교 · 실제 게임 시뮬레이션이 아닌 설명 애니메이션 · 본편 미교체</p><button id="play">재생 / 정지</button><button id="reset">처음으로</button><div id="stage"></div></main><script type="module">
import project from '/src/projects/let-them-play/lookdev/project.ts?project';
import {Player,Stage,Vector2} from '@motion-canvas/core';
const stage=new Stage();stage.configure({size:new Vector2(1920,1080),resolutionScale:1,background:'#fff'});document.querySelector('#stage').append(stage.finalBuffer);
const player=new Player(project,{fps:60,size:new Vector2(1920,1080),resolutionScale:1},{paused:true,muted:true});let ready=false,rendered=-1;
player.onRecalculated.subscribe(()=>ready=true);player.onRender.subscribe(async()=>{await stage.render(player.playback.currentScene,player.playback.previousScene);rendered=player.playback.frame});
const jump=t=>player.requestSeek(Math.round(t*60));document.querySelector('#play').onclick=()=>player.togglePlayback();document.querySelector('#reset').onclick=()=>{player.togglePlayback(false);jump(0)};
window.lookdev={stage,player,jump,get ready(){return ready},get rendered(){return rendered}};
</script></body></html>
