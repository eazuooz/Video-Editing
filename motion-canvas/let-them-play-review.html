<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>야숨 — 게임의 첫 화면</title>
<style>body{margin:24px;background:#fff;color:#202020;font:16px 'Malgun Gothic',sans-serif}main{max-width:1440px;margin:auto}nav{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}button,select{font:inherit;padding:10px;border:1px solid #cbd0d6;background:#f2f4f7}canvas{width:100%;height:auto}p{color:#737373}a{color:#2f5faa}</style></head>
<body><main><h1>게임의 첫 화면 — 야숨 관찰 → 디자인 해설 → 설계 비교</h1><p>8개 독립 장면 · 실제 발화 길이에 맞춘 1:1:1 구성 · 내레이션 + 작은 게임 원음 + 연속 Discovery. 출처는 프로젝트의 YouTube 설명란 파일에 정리되어 있습니다.</p>
<nav><select id="chapter" aria-label="챕터"></select><select id="part" aria-label="구간"><option value="0">야숨 실제 영상</option><option value="1">디자인 해설</option><option value="2">2.5D 설계 비교</option></select><button id="play">소리 켜고 재생 / 정지</button><span id="status">로딩 중</span></nav><div id="stage"></div><p><a href="/src/projects/let-them-play/project">Motion Canvas 편집기</a></p></main>
<script type="module">
import project from '/src/projects/let-them-play/project.ts?project';
import {Player,Stage,Vector2} from '@motion-canvas/core';
import {SCENE_STARTS,SCENE_TITLES,SEGMENT_DURATIONS,TOTAL_DURATION} from '/src/projects/let-them-play/timing.ts';
const fps=60,stage=new Stage();stage.configure({size:new Vector2(1920,1080),resolutionScale:1,background:'#fff'});
document.querySelector('#stage').append(stage.finalBuffer);
const player=new Player(project,{fps,size:new Vector2(1920,1080),resolutionScale:1},{paused:true,muted:true});
let ready=false,rendered=-1;
player.onRender.subscribe(async()=>{await stage.render(player.playback.currentScene,player.playback.previousScene);rendered=player.playback.frame;document.querySelector('#status').textContent=(rendered/fps).toFixed(1)+' / '+TOTAL_DURATION+'초';});
player.onRecalculated.subscribe(()=>ready=true);
const chapter=document.querySelector('#chapter'),part=document.querySelector('#part');
SCENE_TITLES.forEach((title,i)=>chapter.add(new Option((i+1)+'. '+title,String(i))));
const jump=t=>player.requestSeek(Math.round(t*fps));
const seek=()=>{player.togglePlayback(false);const i=Number(chapter.value);jump(SCENE_STARTS[i]+Number(part.value)*SEGMENT_DURATIONS[i]+0.5);};
chapter.onchange=seek;part.onchange=seek;document.querySelector('#play').onclick=()=>{player.toggleAudio(true);player.togglePlayback();};
window.thirdReview={player,stage,jump,get ready(){return ready},get rendered(){return rendered},starts:SCENE_STARTS,segmentSeconds:SEGMENT_DURATIONS};
</script></body></html>
